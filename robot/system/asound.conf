# Robot Radyo: robotun kendi sesleri ile radyonun aynı anda çalabilmesi için yazılımsal karıştırma (dmix).
# Robotun ses kütüphanesi (librrsound) kartı "default" adıyla açar; burada "default" ortak karıştırıcıya yönlendirilir.
# Geri almak için bu dosyayı silmek yeterli.

pcm.!default {
    type plug
    slave.pcm "robotmix"
}

pcm.robotmix {
    type dmix
    ipc_key 424242
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# Radyo zinciri: "Radyo Ses" (kullanıcının ses ayarı) -> "Radyo" (robot konuşurken kısma) -> karıştırıcı.
# İkisi de ses kartının hemen önünde olduğu için değişiklikler anında duyulur.
pcm.radyo {
    type plug
    slave.pcm "radyoses"
}

pcm.radyoses {
    type softvol
    slave.pcm "radyosoftvol"
    control {
        name "Radyo Ses"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}

pcm.radyosoftvol {
    type softvol
    slave.pcm "robotmix"
    control {
        name "Radyo"
        card 0
    }
    min_dB -36.0
    max_dB 0.0
}
